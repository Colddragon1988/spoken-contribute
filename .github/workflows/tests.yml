name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-22.04  # die älteste unterstützte Python-Version
            python: "3.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # compileall übergeht Dateien, die nicht auf .py enden; den Startpunkt prüft py_compile.
      - name: Alle Module übersetzen
        run: |
          python -m compileall -q spoken_contribute tests
          python -m py_compile Spoken-Upload.pyw
      # Unter Linux gibt es keinen Bildschirm; Xvfb täuscht einen vor, damit auch die
      # Fenster-Tests laufen. Windows und macOS haben einen.
      - name: Tests
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}python -m unittest discover -s tests -v
