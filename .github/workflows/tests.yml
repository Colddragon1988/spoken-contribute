name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-22.04  # die älteste unterstützte Python-Version
            python: "3.8"
    env:
      PYTHONIOENCODING: utf-8  # Windows-Konsole: Umlaute in Testnamen nicht als Fehler
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # compileall übergeht Dateien, die nicht auf .py enden; den Startpunkt prüft py_compile.
      - name: Alle Module übersetzen
        run: |
          python -m compileall -q spoken_contribute tests
          python -m py_compile Spoken-Upload.pyw
      # Unter Linux gibt es keinen Bildschirm; Xvfb täuscht einen vor, damit auch die
      # Fenster-Tests laufen. Windows und macOS haben einen.
      - name: Tests
        run: |
          set -o pipefail
          ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}python -m unittest discover -s tests -v 2>&1 | tee test-ausgabe.txt
      # Fehlgeschlagene Tests als Hinweis am Lauf anzeigen – lesbar auch ohne Anmeldung.
      - name: Fehler als Hinweis anzeigen
        if: failure()
        run: |
          python - <<'EOF'
          from pathlib import Path
          text = Path("test-ausgabe.txt").read_text(encoding="utf-8", errors="replace")
          start = text.find("=" * 70)
          body = (text[start:] if start >= 0 else text[-6000:])[:12000]
          body = body.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=Fehlgeschlagene Tests::{body}")
          EOF
